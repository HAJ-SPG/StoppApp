# Prüft und baut die Android-App bei jedem Push.
# Die Debug-APK liegt danach unter „Actions“ → Lauf → „Artifacts“ → stoppapp-debug-apk.
name: Android

on:
  push:
    branches: [main, "build/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: Abhängigkeiten
        run: flutter pub get

      - name: Analyse
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: Debug-APK bauen
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: stoppapp-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
