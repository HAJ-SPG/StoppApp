<title>StoppApp Statistik</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYP – Wegwerf-Code. Frage: Wie sieht die Statistik-Seite aus?
  Drei Varianten, umschaltbar über die schwarze Leiste unten oder #uebersicht, #fokus, #tabelle:
    A · Übersicht → Detail – Liste aller Ereignisse mit Mini-Verlauf; antippen öffnet die Detailseite. Tab „Mein Tag“ = Tagesverteilung.
    B · Fokus              – Ein Ereignis oben wählen, alles dazu auf einer Seite mit großer Ø-Zahl und Vergleich zur Vorperiode. Tab „Typischer Tag“.
    C · Tabelle            – Sortierbare Tabelle aller Kennzahlen, Zeile aufklappen für Verlauf, Wochentage und Uhrzeit.
  Beispieldaten: Mai bis 6. Nov 2026, erzeugt aus Wochenregel + Ketten. Zustand nur im Speicher.
-->

<style>

  --go: #3FBF8A; --go-soft: #173A2C; --stop: #F06A50;

:root[data-theme="dark"] {

/* Filter */

/* B */

/* Diagramme */

.spark { width: 84px; height: 26px; }

#tip b { display: block; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--data); vertical-align: middle; margin-right: 4px; }
.legend i.m { border-top: 1px dashed var(--muted); }
.empty { padding: 20px; text-align: center; color: var(--muted); }

/* Prototyp-Leiste (nicht Teil des Designs) */
#proto { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--proto-bg); color: var(--proto-fg); border-radius: 999px; display: flex; align-items: center; gap: 2px; padding: 4px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: calc(100% - 24px); }
#proto button { color: var(--proto-fg); padding: 8px 10px; border-radius: 999px; white-space: nowrap; }
#proto button:hover { background: rgba(127,127,127,.25); }

<div id="phone"><div id="app"></div></div>
<div id="tip" hidden></div>
<div id="proto">
  <button id="pv" aria-label="Vorherige Variante">◀</button>
  <span class="vl" id="vlabel"></span>
  <button id="nv" aria-label="Nächste Variante">▶</button>
</div>

<script>
// ===================== Beispieldaten =====================
const EVENTS = { zp:"Zähneputzen", fr:"Frühstück", af:"Arbeit fahren", ar:"Arbeiten", es:"Essen", hf:"Heimfahren", ek:"Einkaufen", sp:"Sport", du:"Duschen" };
const BASE = { zp:3.2, fr:14, af:31, ar:225, es:34, hf:33, ek:22, sp:52, du:11 };
const CHAINS = {
  Arbeitstag: { start:6*60+20, steps:["zp","fr","af","ar","es","ar","hf"] },
  Homeoffice: { start:7*60+5, steps:["zp","fr","ar","es","ar","sp","du"] },
  Wochenende: { start:8*60+40, steps:["zp","fr","sp","du","es"] },
};
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"], WD_ORDER = [1,2,3,4,5,6,0];
const pad = n => String(n).padStart(2, "0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d, 12); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, 12);
const TODAY = new Date(2026, 10, 6, 12), TK = key(TODAY), FIRST = "2026-05-01";
let s = 11; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
const gauss = () => (rnd() + rnd() + rnd() - 1.5) / 1.5;
const M = []; // { k, wd, chain, ev, step, start, dur }
for (let d = parse(FIRST); key(d) <= TK; d = addDays(d, 1)) {
  const k = key(d), wd = d.getDay();
  if (k >= "2026-08-03" && k <= "2026-08-16") continue; // Urlaub, keine Kette
  let chain = wd === 0 || wd === 6 ? "Wochenende" : rnd() < .14 ? "Homeoffice" : "Arbeitstag";
  const C = CHAINS[chain]; let t = C.start + gauss()*12;
  const winter = d.getMonth() >= 9 ? 1 : 0, summer = d.getMonth() >= 5 && d.getMonth() <= 7 ? 1 : 0;
  C.steps.forEach((ev, i) => {
    if (rnd() < .06) return;
    if (rnd() < .05) { const dd = 18 + gauss()*6; M.push({ k, wd, chain, ev:"ek", step:null, start:t, dur:dd }); t += dd + 4; }
    let b = BASE[ev]; if (ev === "af" || ev === "hf") b += winter*6 - summer*3; if (ev === "sp") b += summer*10; if (ev === "fr" && wd === 0) b += 15;
    const dur = Math.max(1, b * (1 + gauss() * (ev === "zp" ? .25 : .14)));
    if (k === TK && t > 10*60) return;
    M.push({ k, wd, chain, ev, step:i, start:t, dur });
    t += dur + Math.max(0, gauss()*6 + 5);
  });
}

// ===================== Filter =====================
const F = { type:"monat", anchor:TK, from:"2026-09-01", to:TK, chain:"alle", wds:new Set(WD_ORDER) };
function range(type = F.type, anchor = F.anchor) {
  const a = parse(anchor);
  if (type === "woche") { const mo = addDays(a, -((a.getDay() + 6) % 7)); return [key(mo), key(addDays(mo, 6)), `KW ${kw(mo)} · ${mo.getDate()}.${mo.getMonth()+1}.–${addDays(mo,6).getDate()}.${addDays(mo,6).getMonth()+1}.`]; }
  if (type === "monat") { const f = new Date(a.getFullYear(), a.getMonth(), 1, 12), l = new Date(a.getFullYear(), a.getMonth()+1, 0, 12); return [key(f), key(l), f.toLocaleDateString("de-AT", { month:"long", year:"numeric" })]; }
  if (type === "jahr") return [`${a.getFullYear()}-01-01`, `${a.getFullYear()}-12-31`, String(a.getFullYear())];
  return [F.from, F.to, "Frei"];
}
function shiftAnchor(n) { const a = parse(F.anchor);
  F.anchor = key(F.type === "woche" ? addDays(a, 7*n) : F.type === "monat" ? new Date(a.getFullYear(), a.getMonth()+n, 1, 12) : new Date(a.getFullYear()+n, 0, 1, 12));
  if (F.anchor > TK) F.anchor = TK; }
function prevRange() { if (F.type === "frei") { const days = (parse(F.to) - parse(F.from)) / 864e5 + 1; return [key(addDays(parse(F.from), -days)), key(addDays(parse(F.from), -1))]; }
  const a = parse(F.anchor); const p = key(F.type === "woche" ? addDays(a, -7) : F.type === "monat" ? new Date(a.getFullYear(), a.getMonth()-1, 1, 12) : new Date(a.getFullYear()-1, 0, 1, 12)); return range(F.type, p); }
function kw(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const n = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - n);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1)); return Math.ceil(((t - y0) / 864e5 + 1) / 7); }
function sel(ev, [from, to] = range()) { return M.filter(m => m.k >= from && m.k <= to && (!ev || m.ev === ev) && (F.chain === "alle" || m.chain === F.chain) && F.wds.has(m.wd)); }
function daysIn([from, to] = range()) { // gefilterte Tage mit mind. einer Messung
  return new Set(M.filter(m => m.k >= from && m.k <= to && (F.chain === "alle" || m.chain === F.chain) && F.wds.has(m.wd)).map(m => m.k)).size; }
function stats(arr) { if (!arr.length) return null; const v = arr.map(m => m.dur).sort((a, b) => a - b), n = v.length, sum = v.reduce((a, b) => a + b, 0);
  return { n, sum, avg:sum/n, med:n % 2 ? v[(n-1)/2] : (v[n/2-1] + v[n/2]) / 2, min:v[0], max:v[n-1] }; }
function buckets(arr, [from, to] = range()) { // Tage, bei langen Zeiträumen Wochen
  const span = (parse(to < TK ? to : TK) - parse(from)) / 864e5 + 1, weekly = span > 45, out = [];
  const end = to < TK ? to : TK;
  for (let d = parse(from); key(d) <= end; d = addDays(d, weekly ? 7 : 1)) {
    let a = key(d), b = key(addDays(d, weekly ? 6 : 0));
    if (weekly && a === from) { const mo = addDays(d, -((d.getDay() + 6) % 7)); b = key(addDays(mo, 6)); d = mo; }
    const xs = arr.filter(m => m.k >= a && m.k <= b);
    out.push({ a, b, v:xs.length ? xs.reduce((s, m) => s + m.dur, 0) / xs.length : null, n:xs.length });
  }
  return { weekly, out };
}

// ===================== Formatierung =====================
function dur(m) { if (m == null) return "–"; if (m < 10) { const s = Math.round(m * 60); return `${Math.floor(s/60)}:${pad(s%60)} Min`; }
  const r = Math.round(m); return r >= 60 ? `${Math.floor(r/60)} h ${pad(r%60)}` : `${r} Min`; }
const durShort = m => m < 10 ? dur(m).replace(" Min", "") : m >= 60 ? dur(m) : String(Math.round(m));
const hm = m => `${pad(Math.floor(m/60))}:${pad(Math.round(m % 60) % 60)}`;
const sumFmt = m => { const h = Math.floor(m / 60); return h >= 1 ? `${h} h ${pad(Math.round(m % 60))}` : `${Math.round(m)} Min`; };
const dShort = k => { const d = parse(k); return `${d.getDate()}.${d.getMonth()+1}.`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

// ===================== Diagramme =====================
function niceTicks(lo, hi, n = 3) { const span = hi - lo || 1, step0 = span / n, mag = 10 ** Math.floor(Math.log10(step0));
  const step = [1, 2, 2.5, 5, 10].map(f => f * mag).find(s => s >= step0); const a = Math.floor(lo / step) * step, out = [];
  for (let v = a; v <= hi + step * .01; v += step) out.push(+v.toFixed(6)); if (out[out.length-1] < hi) out.push(out[out.length-1] + step); return out; }
function lineChart(arr, { h = 150 } = {}) {
  const { weekly, out } = buckets(arr), st = stats(arr); const pts = out.filter(b => b.v != null);
  if (!pts.length) return `<div class="empty">Keine Messungen im Zeitraum.</div>`;
  const W = 340, L = 40, R = 8, T = 8, B = 20, vs = pts.map(p => p.v);
  const ticks = niceTicks(Math.min(...vs, st.med) * .9, Math.max(...vs, st.med) * 1.05), y0 = ticks[0], y1 = ticks[ticks.length-1];
  const X = i => L + (out.length === 1 ? (W-L-R)/2 : i * (W - L - R) / (out.length - 1)), Y = v => T + (h - T - B) * (1 - (v - y0) / (y1 - y0));
  let path = "", area = "", prev = false, seg = [];
  out.forEach((b, i) => { if (b.v == null) { prev = false; return; } path += `${prev ? "L" : "M"}${X(i).toFixed(1)} ${Y(b.v).toFixed(1)}`; prev = true; });
  const grid = ticks.map(t => `<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t)}" y2="${Y(t)}"/><text x="${L-6}" y="${Y(t)+3}" text-anchor="end">${durShort(t)}</text>`).join("");
  const xl = [0, Math.floor((out.length-1)/2), out.length-1].filter((v, i, a) => a.indexOf(v) === i).map(i => `<text x="${X(i)}" y="${h-4}" text-anchor="${i === 0 ? "start" : i === out.length-1 ? "end" : "middle"}">${dShort(out[i].a)}</text>`).join("");
  const colW = (W - L - R) / Math.max(1, out.length - 1);
  const hits = out.map((b, i) => `<rect class="hit" x="${X(i) - colW/2}" y="${T}" width="${colW}" height="${h-T-B}" data-tip="<b>${weekly ? `Woche ab ${dShort(b.a)}` : dShort(b.a)}</b>${b.v == null ? "keine Messung" : `Ø ${dur(b.v)} · ${b.n}×`}"/><line class="hl" x1="${X(i)}" x2="${X(i)}" y1="${T}" y2="${h-B}"/>`).join("");

      <path class="bar" d="M${L} ${y} H${L+bw-4} Q${L+bw} ${y} ${L+bw} ${y+4} V${y+bh-4} Q${L+bw} ${y+bh} ${L+bw-4} ${y+bh} H${L}Z"/>

// ===================== Filter-Leiste =====================

  const chains = `<select id="f-chain" aria-label="Tageskette"><option value="alle">Alle Ketten</option>${Object.keys(CHAINS).map(c => `<option ${F.chain === c ? "selected" : ""}>${c}</option>`).join("")}</select>`;

}

// ===================== Variante A: Übersicht → Detail =====================
const A = { tab:"ereignisse", ev:null };

    <div class="evlist">${evs.map(x => `<button class="evrow" data-a="a-open" data-e="${x.e}"><span class="n"><b>${EVENTS[x.e]}</b><span>${x.st.n}× · Summe ${sumFmt(x.st.sum)}</span></span>${spark(x.arr)}<span class="v">${dur(x.st.avg)}<small>Ø</small></span></button>`).join("") || `<div class="empty">Keine Messungen im Zeitraum.</div>`}</div>
    <div class="small muted">Sortiert nach gemessener Summe. Antippen für Details.</div>`;

// ===================== Variante B: Fokus =====================
const B = { tab:"ereignis", ev:"af", chain:"Arbeitstag" };

// ===================== Variante C: Tabelle =====================
const C = { sort:"sum", dir:-1, open:null, view:"verlauf" };

    .sort((a, b) => C.sort === "name" ? EVENTS[a.e].localeCompare(EVENTS[b.e], "de") * -C.dir : (a.st[C.sort] - b.st[C.sort]) * C.dir);

// ===================== Render & Varianten =====================

document.addEventListener("pointermove", e => { const t = e.target.closest?.("[data-tip]"); if (!t) return hideTip();
  tip.innerHTML = t.dataset.tip; tip.hidden = false; const r = tip.getBoundingClientRect();
  let x = e.clientX + 12, y = e.clientY - r.height - 12; if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 12; if (y < 8) y = e.clientY + 16; tip.style.left = x + "px"; tip.style.top = y + "px"; });
document.addEventListener("pointerdown", e => { if (e.pointerType !== "mouse") { const t = e.target.closest?.("[data-tip]"); if (!t) hideTip(); } });
document.getElementById("app").addEventListener("scroll", hideTip);
document.addEventListener("keydown", e => { if (e.target.closest("input,textarea,select,[contenteditable]")) return;
  if (e.key === "ArrowLeft") setVariant(vi - 1); if (e.key === "ArrowRight") setVariant(vi + 1); });
document.getElementById("pv").onclick = () => setVariant(vi - 1);
document.getElementById("nv").onclick = () => setVariant(vi + 1);
render();
</script>
