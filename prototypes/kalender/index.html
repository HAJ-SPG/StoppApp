<title>StoppApp Kalender</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYP – Wegwerf-Code. Frage: Wie sehen Kalender und Tagesprotokoll aus?
  Drei Varianten, umschaltbar über die schwarze Leiste unten oder #raster, #liste, #pinsel:
    A · Raster  – Monatsraster, Tag antippen öffnet ein Sheet, „Auswählen“ für mehrere Tage/Zeitraum, Protokoll als eigener Screen.
    B · Liste   – Fortlaufende Tagesliste mit Wochenregel-Leiste oben, Zeitraum über ein Formular, Protokoll klappt inline auf.
    C · Pinsel  – Kette aus einer Palette wählen und über Tage malen, Wochenregel ist die oberste Zeile, Protokoll unter dem Raster.
  „Heute“ ist fest Fr, 6. Nov 2026, 10:12. Zustand nur im Speicher.
-->

  --c-wochenende: #BE8DDC; --c-wochenende-soft: #312238; --c-none: #8E9A94; --c-none-soft: #26302C; --on-solid: #0F1714;

/* ---------- Bottom-Sheet ---------- */

.sheet { width: 100%; max-width: 420px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 85%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

<script>
// ===================== Daten =====================
const EVENTS = { zp:"Zähneputzen", fr:"Frühstück", af:"Arbeit fahren", ar:"Arbeiten", es:"Essen", hf:"Heimfahren", ek:"Einkaufen", sp:"Sport", du:"Duschen" };
const BASE = { zp:3, fr:14, af:31, ar:225, es:34, hf:33, ek:22, sp:52, du:11 };
const CHAINS = {
  arbeitstag: { name:"Arbeitstag", short:"Arbeit", start:6*60+20, steps:["zp","fr","af","ar","es","ar","hf"] },
  homeoffice: { name:"Homeoffice", short:"Home", start:7*60+5, steps:["zp","fr","ar","es","ar","sp","du"] },
  wochenende: { name:"Wochenende", short:"WE", start:8*60+40, steps:["zp","fr","sp","du","es"] },
};
const NONE = "none";
const chName = c => c === NONE ? "Keine Kette" : CHAINS[c].name;
const chShort = c => c === NONE ? "–" : CHAINS[c].short;
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"]; const WD_ORDER = [1,2,3,4,5,6,0];
const WD_LONG = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];

const pad = n => String(n).padStart(2, "0");
const key = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = k => { const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d, 12); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n, 12);
const TODAY = new Date(2026, 10, 6, 12); const TK = key(TODAY); const NOW = 10*60 + 12;
const isPast = k => k < TK; const isFuture = k => k > TK;

// ===================== Zustand =====================
let RULE = { 1:"arbeitstag", 2:"arbeitstag", 3:"arbeitstag", 4:"arbeitstag", 5:"arbeitstag", 6:"wochenende", 0:"wochenende" };
let EXC = {}; // Datum -> Kette | "none"
let MEAS = {}; // Datum -> [{ id, ev, start, stop|null, chain }]
let nextId = 1;
function tageskette(k) { return k in EXC ? { chain:EXC[k], src:"ausnahme" } : { chain:RULE[parse(k).getDay()] ?? NONE, src:"regel" }; }

function seed() {
  EXC = { "2026-10-29":"homeoffice", "2026-11-03":"homeoffice", "2026-11-12":"homeoffice", "2026-11-13":"homeoffice" };
  for (let d = 23; d <= 27; d++) EXC[`2026-11-${d}`] = NONE; // Urlaub
  let s = 7; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  MEAS = {};
  for (let d = addDays(TODAY, -20); key(d) <= TK; d = addDays(d, 1)) {
    const k = key(d), { chain } = tageskette(k); if (chain === NONE) continue;
    const C = CHAINS[chain]; let t = C.start + Math.round(rnd()*20) - 10; const list = [];
    for (const ev of C.steps) {
      if (rnd() < .07) continue;
      if (rnd() < .08) { const e2 = t + 18; list.push({ id:nextId++, ev:"ek", start:t, stop:e2, chain:C.name }); t = e2 + 4; }
      const dur = Math.max(1, Math.round(BASE[ev] * (.8 + rnd()*.4)));
      if (k === TK && t > NOW) break;
      const stop = k === TK && t + dur > NOW ? null : t + dur;
      list.push({ id:nextId++, ev, start:t, stop, chain:C.name });
      if (stop == null) break;
      t = stop + Math.round(rnd() * (rnd() < .2 ? 25 : 9));
    }
    MEAS[k] = list;
  }
}
seed();

// Rückgängig
let undoSnap = null;
const snap = () => JSON.stringify({ RULE, EXC, MEAS });
function restore(j) { const o = JSON.parse(j); RULE = o.RULE; EXC = o.EXC; MEAS = o.MEAS; }
let toastTimer;
function toast(msg, snapshot) {
  undoSnap = snapshot; const el = document.getElementById("toast");
  el.innerHTML = `<span>${msg}</span>${snapshot ? `<button data-a="undo">Rückgängig</button>` : ""}`; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 5000);
}

// ===================== Helfer =====================

// ===================== Tagesprotokoll (gemeinsam) =====================
function Protocol(k, { showDate = true } = {}) {
  const list = sorted(k), t = tageskette(k);

    if (i > 0) { const prev = list[i-1]; const g = m.start - (prev.stop ?? m.start);

    const other = m.chain !== chName(t.chain) ? `<small>gemessen unter „${m.chain}“</small>` : "";
    if (m.stop == null) rows.push(`<div class="m run"><span class="t num">${hm(m.start)} – …</span><span class="n">${EVENTS[m.ev]}<small>läuft · korrigieren auf dem Haupt-Screen</small></span><span class="dur num">${dur(NOW - m.start)}</span></div>`);
    else rows.push(`<button class="m" data-a="edit" data-k="${k}" data-id="${m.id}"><span class="t num">${hm(m.start)} – ${hm(m.stop)}</span><span class="n">${EVENTS[m.ev]}${other}</span><span class="dur num">${dur(m.stop - m.start)}</span></button>`);

    <div class="mlist">${body}</div>
  </section>`;
}
