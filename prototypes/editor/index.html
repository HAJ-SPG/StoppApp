<title>StoppApp Ketten-Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYP – Wegwerf-Code. Frage: Wie werden Ereignisse und Ereignisketten angelegt, bearbeitet und gelöscht?
  Drei Varianten, umschaltbar über die schwarze Leiste unten oder #listen, #baukasten, #notiz:
    A · Listen     – Tabs „Ketten | Ereignisse“, Kette öffnen, Schritte als Liste mit Ziehgriff, „+ Schritt“ öffnet eine Suche.
    B · Baukasten  – Ein Screen: oben die Kette als Kette aus Chips, unten die Ereignis-Palette; antippen fügt ein.
    C · Notiz      – Kette wie eine Notizliste tippen; unbekannte Namen werden als neues Ereignis angelegt.
  Gemeinsam: Ereignis umbenennen/archivieren/wiederherstellen, Kette löschen mit Ersatz für Wochenregel und Ausnahmen.
  Zustand nur im Speicher.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: eine Handy-Spalte (max 420px), Inhalt scrollt, Prototyp-Leiste schwebt unten. Tokens wie in den anderen StoppApp-Prototypen. */
:root {
  --paper: #EEF2EF; --surface: #FFFFFF; --ink: #14201B; --muted: #5E6D66; --line: #CED8D3;
  --go: #1E7A57; --go-soft: #D3EADF; --stop: #C8442C; --stop-soft: #F6DDD6; --warn-soft: #F6ECD3; --warn: #8A5A00;
  --k1: #2F64A8; --k1s: #DCE6F4; --k2: #A86A12; --k2s: #F4E6CF; --k3: #7E4A9E; --k3s: #EBDDF2;
  --k4: #1E7A57; --k4s: #D3EADF; --k5: #B23A5B; --k5s: #F4DAE1; --k6: #4F6B73; --k6s: #DDE6E8;
  --on-solid: #FFFFFF; --proto-bg: #111; --proto-fg: #F5F5F5;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0F1714; --surface: #18221E; --ink: #E6EEEA; --muted: #93A39B; --line: #2C3A34;
  --go: #3FBF8A; --go-soft: #173A2C; --stop: #F06A50; --stop-soft: #43211A; --warn-soft: #3A2E14; --warn: #E6B85C;
  --k1: #6FA2E8; --k1s: #1C2B40; --k2: #E0A54A; --k2s: #3A2C14; --k3: #BE8DDC; --k3s: #312238;
  --k4: #3FBF8A; --k4s: #173A2C; --k5: #EC7C9A; --k5s: #3D1C26; --k6: #93B3BC; --k6s: #222E31;
  --on-solid: #0F1714; --proto-bg: #F2F2F2; --proto-fg: #111; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0F1714; --surface: #18221E; --ink: #E6EEEA; --muted: #93A39B; --line: #2C3A34;
  --go: #3FBF8A; --go-soft: #173A2C; --stop: #F06A50; --stop-soft: #43211A; --warn-soft: #3A2E14; --warn: #E6B85C;
  --k1: #6FA2E8; --k1s: #1C2B40; --k2: #E0A54A; --k2s: #3A2C14; --k3: #BE8DDC; --k3s: #312238;
  --k4: #3FBF8A; --k4s: #173A2C; --k5: #EC7C9A; --k5s: #3D1C26; --k6: #93B3BC; --k6s: #222E31;
  --on-solid: #0F1714; --proto-bg: #F2F2F2; --proto-fg: #111; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--go); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.eyebrow { text-transform: uppercase; letter-spacing: .1em; font-size: 11px; font-weight: 700; color: var(--muted); }

#phone { max-width: 420px; height: 100%; margin: 0 auto; display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 0; }
#app { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding-bottom: 90px; }

.k1 { --c: var(--k1); --cs: var(--k1s); } .k2 { --c: var(--k2); --cs: var(--k2s); } .k3 { --c: var(--k3); --cs: var(--k3s); }
.k4 { --c: var(--k4); --cs: var(--k4s); } .k5 { --c: var(--k5); --cs: var(--k5s); } .k6 { --c: var(--k6); --cs: var(--k6s); }
.swatch { width: 14px; height: 14px; border-radius: 5px; background: var(--c); flex: none; display: inline-block; }

.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.title { font-family: var(--display); font-weight: 800; font-size: 26px; }
.back { font-weight: 700; color: var(--muted); padding: 6px 0; }
.pill { border: 1.5px solid var(--line); border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.pill.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn { border-radius: 12px; padding: 11px 14px; font-weight: 700; background: var(--go); color: #fff; white-space: nowrap; text-align: center; }
.btn.ghost { background: none; color: var(--ink); border: 1.5px solid var(--line); }
.btn.danger { background: var(--stop); }
.btn[disabled] { opacity: .4; pointer-events: none; }
.addbtn { font-weight: 700; color: var(--go); padding: 12px; text-align: left; width: 100%; }
.note { background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 700; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.li { display: flex; align-items: center; gap: 10px; padding: 12px; text-align: left; width: 100%; min-width: 0; }
.li .grow { flex: 1; min-width: 0; }
.li .grow b { display: block; }
.li .grow span { display: block; font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
button.li:hover { background: var(--paper); }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
.tabs button { flex: 1; padding: 8px; border-radius: 999px; font-weight: 700; color: var(--muted); }
.tabs button.on { background: var(--ink); color: var(--paper); }

/* A · Schritte mit Ziehgriff */
.step { display: grid; grid-template-columns: 28px 24px 1fr 36px; align-items: center; gap: 6px; padding: 8px 8px 8px 4px; background: var(--surface); }
.step .h { cursor: grab; touch-action: none; color: var(--muted); font-size: 20px; text-align: center; user-select: none; padding: 8px 0; }
.step .i { font-size: 12px; color: var(--muted); text-align: right; }
.step .n { font-weight: 700; min-width: 0; }
.step .n small { font-weight: 400; color: var(--muted); font-size: 12px; }
.step .x { width: 36px; height: 36px; border-radius: 10px; color: var(--muted); font-size: 18px; }
.step .x:hover { background: var(--stop-soft); color: var(--stop); }
.step.drag { background: var(--go-soft); box-shadow: 0 4px 16px rgba(0,0,0,.15); position: relative; z-index: 2; }
.chainhead { display: flex; align-items: center; gap: 10px; }
.chainhead h2 { font-family: var(--display); font-size: 26px; font-weight: 800; }
.chainhead .swatch { width: 22px; height: 22px; border-radius: 8px; }

/* B · Baukasten */
.chaintabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.chaintabs .pill { display: inline-flex; gap: 6px; align-items: center; }
.seq { display: flex; flex-wrap: wrap; gap: 6px 4px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; min-height: 80px; }
.tok { display: inline-flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 12px; background: var(--cs); color: var(--ink); font-weight: 700; font-size: 14px; border: 2px solid transparent; }
.tok .ix { font-family: var(--mono); font-size: 11px; color: var(--c); }
.tok.sel { border-color: var(--c); background: var(--surface); }
.arrow { color: var(--muted); font-size: 12px; }
.caret { width: 3px; height: 30px; background: var(--go); border-radius: 2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.seltools { display: flex; gap: 6px; flex-wrap: wrap; }
.seltools button { flex: 1; min-width: 70px; padding: 9px 8px; border-radius: 10px; border: 1.5px solid var(--line); font-weight: 700; font-size: 13px; }
.palette { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { padding: 9px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: 14px; }
.pchip:hover { border-color: var(--go); }
.pchip.new { border-style: dashed; color: var(--go); }
.pchip.edit { border-color: var(--warn); }
.pchip.arch { opacity: .55; text-decoration: line-through; }
.inline-new { display: flex; gap: 6px; }
.inline-new input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 999px; border: 1.5px solid var(--go); background: var(--surface); font-weight: 700; }

/* C · Notiz */
.lines { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px 0; }
.line { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 4px; padding: 2px 8px; }
.line .i { font-family: var(--mono); font-size: 13px; color: var(--muted); text-align: right; padding-right: 4px; }
.line input { width: 100%; min-width: 0; border: 0; border-bottom: 1.5px solid transparent; background: none; padding: 9px 4px; font-weight: 700; font-size: 16px; }
.line input:focus { border-bottom-color: var(--go); outline: none; }
.line .tag { font-size: 11px; font-weight: 700; color: var(--go); background: var(--go-soft); border-radius: 6px; padding: 2px 6px; margin-left: 4px; }
.line .ops { display: flex; }
.line .ops button { width: 32px; height: 34px; border-radius: 8px; color: var(--muted); }
.line .ops button:hover { background: var(--paper); color: var(--ink); }
.namein { font-family: var(--display); font-weight: 800; font-size: 24px; border: 0; border-bottom: 2px solid var(--line); background: none; padding: 4px 0; width: 100%; min-width: 0; }
.namein:focus { outline: none; border-bottom-color: var(--go); }
details.lib { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
details.lib summary { padding: 12px; font-weight: 700; cursor: pointer; }
details.lib .list { border: 0; border-top: 1px solid var(--line); border-radius: 0 0 16px 16px; }

/* Sheet */
#scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 420px; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); max-height: 85%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { font-family: var(--display); font-size: 21px; }
.sheet p { margin: 0; color: var(--muted); font-size: 14px; }
.opt { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); display: flex; align-items: center; gap: 10px; font-weight: 700; width: 100%; }
.opt:hover { border-color: var(--go); } .opt.cur { border-color: var(--ink); }
.opt small { margin-left: auto; color: var(--muted); font-weight: 400; text-align: right; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; color: var(--muted); }
.field input { padding: 11px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--paper); font-weight: 700; font-size: 16px; color: var(--ink); width: 100%; }
.colors { display: flex; gap: 8px; flex-wrap: wrap; }
.colors button { width: 40px; height: 40px; border-radius: 12px; background: var(--c); border: 3px solid transparent; }
.colors button.on { border-color: var(--ink); }
.err { color: var(--stop); font-size: 13px; font-weight: 700; }
.sheet-actions { display: flex; gap: 8px; } .sheet-actions .btn { flex: 1; }
.uses { font-size: 13px; background: var(--paper); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(66px + env(safe-area-inset-bottom, 0px)); z-index: 26; background: var(--ink); color: var(--paper); border-radius: 12px; padding: 10px 12px; display: flex; gap: 12px; align-items: center; font-size: 14px; max-width: calc(100% - 32px); box-shadow: 0 6px 20px rgba(0,0,0,.25); }
#toast button { color: var(--paper); font-weight: 700; text-decoration: underline; }

/* Prototyp-Leiste (nicht Teil des Designs) */
#proto { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 30;
  background: var(--proto-bg); color: var(--proto-fg); border-radius: 999px; display: flex; align-items: center; gap: 2px; padding: 4px; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.3); max-width: calc(100% - 24px); }
#proto button { color: var(--proto-fg); padding: 8px 10px; border-radius: 999px; white-space: nowrap; }
#proto button:hover { background: rgba(127,127,127,.25); }
#proto .vl { font-weight: 700; min-width: 120px; text-align: center; }
#debug { position: fixed; z-index: 25; left: 50%; transform: translateX(-50%); bottom: calc(62px + env(safe-area-inset-bottom, 0px)); width: min(420px, calc(100% - 24px));
  background: var(--proto-bg); color: var(--proto-fg); border-radius: 14px; padding: 12px; max-height: 55%; overflow: auto; }
#debug pre { margin: 0; font-family: var(--mono); font-size: 11px; white-space: pre-wrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="phone"><div id="app"></div></div>
<div id="sheetHost"></div>
<div id="toast" hidden></div>
<div id="debug" hidden></div>
<div id="proto">
  <button id="pv" aria-label="Vorherige Variante">◀</button>
  <span class="vl" id="vlabel"></span>
  <button id="nv" aria-label="Nächste Variante">▶</button>
  <button id="dbg">Zustand</button>
</div>

<script>
// ===================== Daten =====================
let EV, CH, RULE, EXC, nid = 100;
const TODAY_CHAIN = "arbeitstag", TODAY_DONE = 3; // heute: Arbeitstag, 3 Schritte erledigt
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"], WD_ORDER = [1,2,3,4,5,6,0];
const COLORS = ["k1","k2","k3","k4","k5","k6"];
function seed() {
  EV = {
    zp:{ name:"Zähneputzen", n:412 }, fr:{ name:"Frühstück", n:205 }, af:{ name:"Arbeit fahren", n:148 }, ar:{ name:"Arbeiten", n:301 },
    es:{ name:"Essen", n:198 }, hf:{ name:"Heimfahren", n:146 }, ek:{ name:"Einkaufen", n:37 }, sp:{ name:"Sport", n:58 },
    du:{ name:"Duschen", n:60 }, la:{ name:"Laufen", n:12, arch:true }, ze:{ name:"Zeitung lesen", n:0 },
  };
  CH = [
    { id:"arbeitstag", name:"Arbeitstag", color:"k1", steps:["zp","fr","af","ar","es","ar","hf"] },
    { id:"homeoffice", name:"Homeoffice", color:"k2", steps:["zp","fr","ar","es","ar","sp","du"] },
    { id:"wochenende", name:"Wochenende", color:"k3", steps:["zp","fr","sp","du","es"] },
  ];
  RULE = { 1:"arbeitstag", 2:"arbeitstag", 3:"arbeitstag", 4:"arbeitstag", 5:"arbeitstag", 6:"wochenende", 0:"wochenende" };
  EXC = { "2026-11-03":"homeoffice", "2026-11-12":"homeoffice", "2026-11-13":"homeoffice", "2026-10-29":"homeoffice" };
}
seed();
const chain = id => CH.find(c => c.id === id);
const activeEvents = () => Object.entries(EV).filter(([, e]) => !e.arch).sort((a, b) => a[1].name.localeCompare(b[1].name, "de"));
const archivedEvents = () => Object.entries(EV).filter(([, e]) => e.arch);
function ruleDays(id) { return WD_ORDER.filter(i => RULE[i] === id).map(i => WD[i]); }
function excCount(id) { return Object.values(EXC).filter(c => c === id).length; }
function usageText(id) {
  const r = ruleDays(id), x = excCount(id), parts = [];
  if (r.length) parts.push(r.length >= 3 && r.join(",") === "Mo,Di,Mi,Do,Fr" ? "Mo–Fr" : r.join(", "));
  if (x) parts.push(`${x} ${x === 1 ? "Ausnahme" : "Ausnahmen"}`);
  return parts.length ? parts.join(" · ") : "nicht zugewiesen";
}
function evUse(evId) { // [{chain, count}]
  return CH.map(c => ({ c, n:c.steps.filter(s => s === evId).length })).filter(x => x.n);
}
function evUseText(evId) {
  const u = evUse(evId), e = EV[evId];
  const a = u.length ? u.map(x => `${x.c.name}${x.n > 1 ? " ×" + x.n : ""}`).join(", ") : "in keiner Kette";
  return `${a} · ${e.n} Messungen`;
}
function findEventByName(name) { const n = name.trim().toLowerCase(); return Object.keys(EV).find(k => EV[k].name.toLowerCase() === n); }
function createEvent(name) { const id = "e" + nid++; EV[id] = { name:name.trim(), n:0 }; return id; }
const todayNote = c => c.id === TODAY_CHAIN ? `<div class="note">Heute läuft diese Kette (${TODAY_DONE} von ${c.steps.length} erledigt). Änderungen gelten ab morgen.</div>` : "";

// Rückgängig
let undoSnap = null, toastTimer;
const snap = () => JSON.stringify({ EV, CH, RULE, EXC });
function restore(j) { ({ EV, CH, RULE, EXC } = JSON.parse(j)); }
function toast(msg, s) { undoSnap = s; const el = document.getElementById("toast");
  el.innerHTML = `<span>${msg}</span>${s ? `<button data-a="undo">Rückgängig</button>` : ""}`; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 5000); }
const esc = s => s.replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

// ===================== Variante A: Listen =====================
const A = { tab:"ketten", chain:null };
function VariantA() {
  if (A.chain) { const c = chain(A.chain); if (!c) { A.chain = null; return VariantA(); }
    const counts = {}; c.steps.forEach(s => counts[s] = (counts[s] || 0) + 1);
    return `<div class="top"><button class="back" data-a="a-back">‹ Ketten</button><button class="pill" data-a="chainmenu" data-id="${c.id}">⋯ Mehr</button></div>
      <button class="chainhead ${c.color}" data-a="meta" data-id="${c.id}" title="Name und Farbe ändern"><span class="swatch"></span><h2>${esc(c.name)}</h2><span class="muted small">✎</span></button>
      <div class="muted small">Gilt: ${usageText(c.id)}</div>
      ${todayNote(c)}
      <div class="list" id="steps">${c.steps.map((s, i) => `<div class="step" data-i="${i}"><span class="h" data-drag="${i}" aria-label="Ziehen zum Umsortieren">≡</span><span class="i num">${i+1}</span><span class="n">${esc(EV[s].name)}${counts[s] > 1 ? ` <small>· ${counts[s]}× in der Kette</small>` : ""}</span><button class="x" data-a="rmstep" data-i="${i}" aria-label="Schritt entfernen">×</button></div>`).join("")}
        <button class="addbtn" data-a="pick" data-id="${c.id}">+ Schritt hinzufügen</button></div>
      <div class="muted small">Ziehgriff ≡ zum Umsortieren. Ein Ereignis darf mehrfach vorkommen.</div>`; }
  const tabs = `<div class="tabs"><button class="${A.tab === "ketten" ? "on" : ""}" data-a="a-tab" data-t="ketten">Ketten</button><button class="${A.tab === "ereignisse" ? "on" : ""}" data-a="a-tab" data-t="ereignisse">Ereignisse</button></div>`;
  if (A.tab === "ketten") return `<div class="title">Ketten & Ereignisse</div>${tabs}
    <div class="list">${CH.map(c => `<button class="li ${c.color}" data-a="a-open" data-id="${c.id}"><span class="swatch"></span><span class="grow"><b>${esc(c.name)}</b><span>${c.steps.length} Schritte · ${usageText(c.id)}</span><span>${c.steps.map(s => esc(EV[s].name)).join(" → ") || "noch leer"}</span></span><span class="muted">›</span></button>`).join("")}
      <button class="addbtn" data-a="newchain">+ Neue Kette</button></div>`;
  return `<div class="title">Ketten & Ereignisse</div>${tabs}${EventLibrary()}`;
}
function EventLibrary() {
  const arch = archivedEvents();
  return `<div class="list">${activeEvents().map(([k, e]) => `<button class="li" data-a="evedit" data-k="${k}"><span class="grow"><b>${esc(e.name)}</b><span>${evUseText(k)}</span></span><span class="muted">›</span></button>`).join("")}
      <button class="addbtn" data-a="newevent">+ Neues Ereignis</button></div>
    ${arch.length ? `<div class="eyebrow">Archiviert</div><div class="list">${arch.map(([k, e]) => `<div class="li"><span class="grow"><b class="muted">${esc(e.name)}</b><span>${e.n} Messungen · in Statistik weiter sichtbar</span></span><button class="pill" data-a="restore" data-k="${k}">Wiederherstellen</button></div>`).join("")}</div>` : ""}`;
}

function cCommit(input) {

  const i = +line, cur = c.steps[i]; if (!v) { input.value = EV[cur].name; return false; }
  if (EV[cur].name === v) return false;
  const sn = snap(); let id = findEventByName(v), created = false; if (!id) { id = createEvent(v); created = true; } else if (EV[id].arch) EV[id].arch = false;

  }[a] || (() => {}))();
});
document.addEventListener("keydown", e => { if (e.target.closest("input,textarea,select,[contenteditable]")) return;
  if (e.key === "ArrowLeft") setVariant(vi - 1); if (e.key === "ArrowRight") setVariant(vi + 1); if (e.key === "Escape") closeSheet(); });
document.getElementById("pv").onclick = () => setVariant(vi - 1);
document.getElementById("nv").onclick = () => setVariant(vi + 1);
document.getElementById("dbg").onclick = () => { const d = document.getElementById("debug"); d.hidden = !d.hidden; renderDebug(); };
function renderDebug() { const d = document.getElementById("debug"); if (d.hidden) return;
  d.innerHTML = `<pre>${esc(JSON.stringify({
    ketten: CH.map(c => `${c.name}: ${c.steps.map(s => EV[s].name).join(" → ")}`),
    ereignisse: Object.values(EV).map(e => `${e.name}${e.arch ? " (archiviert)" : ""} · ${e.n} Messungen`),
    wochenregel: Object.fromEntries(WD_ORDER.map(i => [WD[i], RULE[i] ? chain(RULE[i])?.name : "Keine Kette"])),
    tagesausnahmen: Object.fromEntries(Object.entries(EXC).map(([k, v]) => [k, v === "none" ? "Keine Kette" : chain(v)?.name])),
  }, null, 2))}</pre>`; }
render();
</script>
